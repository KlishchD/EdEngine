name: Build and run play tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Configure CMake
      shell: cmd
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -S .

    - name: Build
      shell: cmd
      run: cmake --build build --config Release