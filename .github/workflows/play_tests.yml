name: Build and run play tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Configure CMake
      shell: cmd
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -D RUN_CORE_PLAY_TESTS=1 -S .

    - name: Build
      shell: cmd
      run: cmake --build build --config Release
    
    - name: Run app
      shell: cmd
      run: build\EdEditor\Release\EdEditor.exe
    
    - name: Upload run results
      uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: resources/PlayRecordings